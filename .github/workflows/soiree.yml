# Copie déployée dans rydip/taches-nuit/.github/workflows/soiree.yml.
# Relevé du matin (27 octobre 2026, d'abord le soir le 25) : une source est injoignable autour de minuit,
# joignable en journée. Comme pour la nuit, tout ce qui nomme une enseigne reste
# dans le dépôt privé (outils/soiree.sh) ; ce fichier n'en porte que l'appel.
name: soiree

on:
  schedule:
    # 10 h 07, 12 h 07 et 14 h 07 au Maroc, à GMT depuis le 20 septembre 2026. Les suivants ne font rien si un
    # premier a réussi ; ils rattrapent un créneau sauté ou très retardé par GitHub (20 h 07 jamais lancé le 26 octobre).
    - cron: '7 10 * * *'
    - cron: '7 12 * * *'
    - cron: '7 14 * * *'
  workflow_dispatch:
    inputs:
      forcer:
        description: 'Relevé du matin, même déjà fait, lancé à la main'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

# Un seul run à la fois dans le groupe : un run en attente garde le plus récent. Ne pas annuler en cours.
concurrency:
  group: soiree
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.DEPOT }}
          token: ${{ secrets.JETON }}
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt > /dev/null
      # Revérifier l'heure : le relevé du matin court de 9 h à 17 h 59 au Maroc.
      - name: heure avant releve
        id: heure
        env:
          FORCER: ${{ github.event_name == 'workflow_dispatch' && inputs.forcer }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          from zoneinfo import ZoneInfo
          forcer = os.environ.get('FORCER') == 'true'
          heure = datetime.now(ZoneInfo('Africa/Casablanca')).hour
          autorise = 9 <= heure <= 17 or forcer
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('autorise=' + str(autorise).lower() + '\n')
          if forcer:
              print('releve force a la main')
          else:
              print('journee autorisee' if autorise else 'hors de la journee : aucun releve')
          PY
      - name: run
        if: steps.heure.outputs.autorise == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FORCER: ${{ github.event_name == 'workflow_dispatch' && inputs.forcer }}
        run: bash outils/soiree.sh

      - name: garder
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/soiree.yml/enable" > /dev/null

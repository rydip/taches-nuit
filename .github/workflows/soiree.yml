# Copie déployée dans rydip/taches-nuit/.github/workflows/soiree.yml.
# Relevé du matin (27 octobre 2026, d'abord le soir le 25) : une source est injoignable autour de minuit,
# joignable en journée. Comme pour la nuit, tout ce qui nomme une enseigne reste
# dans le dépôt privé (outils/soiree.sh) ; ce fichier n'en porte que l'appel.
name: soiree

on:
  schedule:
    # Toutes les deux heures de 4 h 07 à 18 h 07 au Maroc, à GMT depuis le 20 septembre 2026. Le catalogue et les
    # promos ont chacun leur état : une partie réussie aujourd'hui n'est pas refaite, un créneau de reprise ne
    # relance que ce qui a échoué. GitHub lance ces créneaux en retard (5 h 30 le 31 octobre, 6 h 40 le
    # 1er novembre, plus de 10 h le 2) : le 2 novembre, les quatre créneaux lancés sont partis de 20 h 15 à
    # 23 h 27, tous hors de la journée, et aucun relevé n'a eu lieu. Les créneaux de 4 h 07 à 8 h 07 visent la
    # journée malgré ce retard ; partis à l'heure, ils ne font rien (garde ci-dessous, avant tout pip install).
    - cron: '7 4 * * *'
    - cron: '7 6 * * *'
    - cron: '7 8 * * *'
    - cron: '7 10 * * *'
    - cron: '7 12 * * *'
    - cron: '7 14 * * *'
    - cron: '7 16 * * *'
    - cron: '7 18 * * *'
  workflow_dispatch:
    inputs:
      forcer:
        description: 'Relevé du matin, même déjà fait, lancé à la main'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

# Un seul run à la fois dans le groupe : un run en attente garde le plus récent. Ne pas annuler en cours.
concurrency:
  group: soiree
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.DEPOT }}
          token: ${{ secrets.JETON }}
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Revérifier l'heure : le relevé du jour court de 9 h à 21 h 59 au Maroc (jusqu'à 18 h 59 avant le
      # 3 novembre 2026). La source a répondu à 20 h 53 le 25 octobre et refusé à 23 h 46 le 26.
      # Lue avant le pip install : un créneau hors de la journée s'arrête en quelques secondes.
      - name: heure avant releve
        id: heure
        env:
          FORCER: ${{ github.event_name == 'workflow_dispatch' && inputs.forcer }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          from zoneinfo import ZoneInfo
          forcer = os.environ.get('FORCER') == 'true'
          heure = datetime.now(ZoneInfo('Africa/Casablanca')).hour
          autorise = 9 <= heure <= 21 or forcer
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('autorise=' + str(autorise).lower() + '\n')
          if forcer:
              print('releve force a la main')
          else:
              print('journee autorisee' if autorise else 'hors de la journee : aucun releve')
          PY
      - if: steps.heure.outputs.autorise == 'true'
        run: pip install -q -r requirements.txt > /dev/null
      - name: run
        if: steps.heure.outputs.autorise == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FORCER: ${{ github.event_name == 'workflow_dispatch' && inputs.forcer }}
        run: bash outils/soiree.sh

      - name: garder
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/soiree.yml/enable" > /dev/null

name: taches

on:
  schedule:
    # Contrôle horaire : les sources ne sont lues qu'entre 00 h et 03 h au Maroc.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      forcer:
        description: 'Relevé hors fenêtre de nuit, lancé à la main'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

# Un seul run à la fois dans le groupe : un run armé qui dort le garde, les
# suivants attendent (un seul en attente, le plus récent). Ne pas annuler en cours.
concurrency:
  group: taches
  cancel-in-progress: false

jobs:
  garde:
    runs-on: ubuntu-latest
    # Une exécution armée dort jusqu'à 00 h 02 (Maroc) : 242 min au plus depuis 20 h 00.
    timeout-minutes: 260
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    outputs:
      run: ${{ steps.nuit.outputs.run }}
      marjane: ${{ steps.nuit.outputs.marjane }}
    steps:
      - uses: actions/checkout@v5
      - name: fenetre et historique
        id: nuit
        env:
          GH_TOKEN: ${{ github.token }}
          FORCER: ${{ github.event_name == 'workflow_dispatch' && inputs.forcer }}
        run: python .github/garde_nuit.py --workflow taches.yml --jobs run marjane

  run:
    needs: garde
    if: needs.garde.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 200 depuis le 24 octobre 2026 (100 avant) : si Aswak echoue vers minuit,
    # synchro_nuit.sh attend 02 h 30 (Maroc) pour le second essai, soit
    # ~150 min de job au lieu de ~35.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.DEPOT }}
          token: ${{ secrets.JETON }}
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt > /dev/null

      # Revérifier l'heure après l'attente d'un runner ou du groupe marjane.
      - name: heure avant releve
        id: heure
        env:
          FORCER: ${{ github.event_name == 'workflow_dispatch' && inputs.forcer }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          from zoneinfo import ZoneInfo
          forcer = os.environ.get('FORCER') == 'true'
          autorise = datetime.now(ZoneInfo('Africa/Casablanca')).hour < 3 or forcer
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('autorise=' + str(autorise).lower() + '\n')
          if forcer:
              print('relevé forcé à la main')
          else:
              print('nuit autorisee' if autorise else 'trop tard : aucun releve')
          PY
      - name: run
        id: releve
        if: steps.heure.outputs.autorise == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: bash outils/synchro_nuit.sh

      # 30 octobre 2026 : même annulation par GitHub que le job marjane (01 h 59).
      # Placée avant « garder » : garder reste la dernière étape.
      - name: fil de suivi si interrompu
        if: cancelled() || (failure() && steps.releve.outcome != 'failure')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          [ -f scraper/signaler.py ] || exit 0
          timeout 30 python -m scraper.signaler --source "Carrefour et Aswak" --niveau alerte --message "relevé interrompu avant sa fin (job ${{ job.status }}) : aucun message de fin. Relancer à la main (taches, forcer) si la nuit est passée." || true

      - name: garder
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/taches.yml/enable" > /dev/null

  # Marjane bloque les serveurs GitHub (403 « Access Restricted » depuis le
  # 27 septembre 2026). Ce job sort par le téléphone d'Anass au Maroc
  # (Tailscale, sortie internet) : essai du 8 octobre, pays MA, 401 au lieu
  # de 403. Job séparé : Aswak et Carrefour ne passent pas par le téléphone.
  # Plusieurs sorties peuvent être en ligne à la fois (19 octobre 2026) : le vieux
  # téléphone laissé à la maison (Maroc) et celui d'Anass en voyage (autre pays).
  # L'étape « sortie par le telephone » essaie chaque sortie en ligne et retient la
  # première qui passe par le Maroc. Voir docs/RECAP_sortie_maroc_voyage_19oct.md.
  marjane:
    needs: garde
    if: needs.garde.outputs.marjane == 'true'
    runs-on: ubuntu-latest
    # 150 : omni ~27 min + prix 7-18 + promos un magasin a la fois ~26 + relecture
    # et reconfirmation, mesure du 8 octobre 2026 ; marge pour la latence du telephone.
    # 240 depuis le 10 octobre : rejeu p2 des promos (jusqu'a 59 min) et gardes de sortie ;
    # un depassement tuerait l'etape 8 (journal). Plafond GitHub d'un job : 360.
    # 355 depuis le 12 octobre : 62 min de pause entre 1o, 1, p et p2 (Cloudflare).
    # marjane_nuit.sh saute une etape qui ne tiendrait pas dans 345 min.
    timeout-minutes: 355
    concurrency:
      group: marjane
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.DEPOT }}
          token: ${{ secrets.JETON }}
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt > /dev/null

      - name: tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: sortie par le telephone
        run: |
          # Le budget de marjane_nuit.sh part de cet instant (PRIXMA_DEBUT_JOB, passé par
          # GITHUB_ENV) : l'attente du téléphone ci-dessous est comprise dans ce budget.
          echo "PRIXMA_DEBUT_JOB=$(date +%s)" >> "${GITHUB_ENV:-/dev/null}"
          # Le téléphone peut être endormi, éteint ou pas encore connecté au démarrage du
          # job : on attend jusqu'à 15 min (31 lectures, 30 s entre deux). Par son adresse
          # Tailscale : le nom d'appareil porte des espaces.
          # Plusieurs sorties peuvent être en ligne à la fois (vieux téléphone de la maison,
          # au Maroc, et téléphone d'Anass en voyage) : chaque sortie en ligne est essayée à
          # son tour, la première qui passe par le Maroc est retenue, les autres sont écartées
          # pour tout le job. Affiché : MA, « hors du Maroc » ou « inconnu » ; jamais une
          # adresse, un nom d'appareil ni un autre code pays (dépôt public).
          # L'adresse retenue est écrite dans un fichier du runner, jamais dans GITHUB_ENV
          # (GitHub affiche ces variables dans le journal public) : marjane_nuit.sh la relit.
          fichier_sortie="${RUNNER_TEMP:-/tmp}/prixma_sortie"
          : > "$fichier_sortie"
          pays_de_sortie () {
            # Premier service, puis secours. Rien n'est écrit si aucun ne répond.
            local p
            p=$(curl -fsS -m 10 https://ipinfo.io/country 2>/dev/null | tr -d '[:space:]') || true
            if [[ ! "$p" =~ ^[A-Z]{2}$ ]]; then
              p=$(curl -fsS -m 10 https://ifconfig.co/country-iso 2>/dev/null | tr -d '[:space:]') || true
            fi
            if [[ "$p" =~ ^[A-Z]{2}$ ]]; then
              echo "$p"
            fi
            return 0
          }
          essayer () {
            # essayer <adresse> : remet le noeud de sortie sur cette adresse, attend 5 s, puis
            # six essais de pays espacés de 30 s, avec remise en place entre deux essais.
            # Rend 0 si le pays vu est MA. Le pays du dernier essai est gardé dans dernier_pays,
            # déjà sous sa forme affichée : MA, « hors du Maroc » ou « inconnu ».
            local sortie="$1" essai pays="" err
            if ! err=$(sudo tailscale set --exit-node="$sortie" 2>&1); then
              # Le message peut contenir l'adresse : elle est masquée avant affichage.
              err=${err//"$sortie"/<adresse>}
              echo "tailscale set en echec : ${err:0:200}"
              dernier_pays=""
              return 1
            fi
            sleep 5
            # Le téléphone peut être endormi par Android alors qu'il reste « en ligne » :
            # on vérifie le pays vu depuis internet.
            for essai in 1 2 3 4 5 6; do
              if [ "$essai" -gt 1 ]; then
                sleep 30
                sudo tailscale set --exit-node="$sortie" > /dev/null 2>&1 || true
              fi
              pays=$(pays_de_sortie)
              if [ "$pays" = "MA" ]; then
                break
              fi
            done
            case "$pays" in
              MA) dernier_pays="MA" ;;
              "") dernier_pays="inconnu" ;;
              *) dernier_pays="hors du Maroc" ;;
            esac
            if [ "$pays" != "MA" ]; then
              return 1
            fi
            return 0
          }
          sortie=""
          essais=0
          ecartees=""
          nb_essayees=0
          pays_vus=""
          dernier_pays=""
          for lecture in $(seq 1 31); do
            essais=$lecture
            sorties=$(tailscale status --json | jq -r '[.Peer[] | select(.ExitNodeOption and .Online) | .TailscaleIPs[0]] | join(" ")') || sorties=""
            # Ne pas prendre un appareil hors ligne, ni choisir une sortie arbitraire.
            read -ra candidats <<< "$sorties"
            total=${#candidats[@]}
            if [ "$lecture" -eq 1 ] && [ "$total" -eq 0 ]; then
              echo "téléphone pas encore en ligne : nouvel essai toutes les 30 s pendant 15 min"
            fi
            n=0
            for ip in "${candidats[@]}"; do
              n=$((n + 1))
              # Une sortie écartée dans ce job n'est pas réessayée.
              case " $ecartees " in
                *" $ip "*) continue ;;
              esac
              nb_essayees=$((nb_essayees + 1))
              if essayer "$ip"; then
                echo "sortie n° $n sur $total en ligne : MA, retenue"
                printf '%s\n' "$ip" > "$fichier_sortie"
                sortie=$ip
                break
              fi
              ecartees="$ecartees $ip"
              pays_vus="${pays_vus:+$pays_vus, }${dernier_pays:-inconnu}"
              echo "sortie n° $n sur $total en ligne : ${dernier_pays:-inconnu}, écartée"
            done
            if [ -n "$sortie" ]; then
              break
            fi
            if [ "$lecture" -lt 31 ]; then
              sleep 30
            fi
          done
          if [ -z "$sortie" ]; then
            if [ "$nb_essayees" -eq 0 ]; then
              # Diagnostic sans nom d'appareil ni adresse IP (dépôt public) : ne fait jamais échouer l'étape.
              echo "diagnostic :"
              tailscale status --json | jq -r '[.Peer[] | select(((.Tags // []) | index("tag:ci")) | not)] | "appareils hors runners : \(length) ; sorties déclarées : \([.[] | select(.ExitNodeOption)] | length) ; en ligne : \([.[] | select(.Online)] | length) ; vus pour la dernière fois : \([.[] | .LastSeen // "?"] | join(", "))"' || true
              echo "::error::téléphone absent : allumé, Tailscale connecté, « Run as exit node » actif ?"
            else
              echo "::error::téléphone : la sortie Tailscale ne passe pas par le Maroc (pays vu : ${pays_vus}). Tailscale est probablement endormi sur le téléphone : l'ouvrir et désactiver l'optimisation de batterie."
            fi
            exit 1
          fi
          if [ "$essais" -gt 1 ]; then
            echo "téléphone en ligne après $essais essai(s)"
          fi
          echo "sortie par le telephone vérifiée : MA"

      # Revérifier l'heure après l'attente d'un runner ou du groupe marjane.
      - name: heure avant releve
        id: heure
        env:
          FORCER: ${{ github.event_name == 'workflow_dispatch' && inputs.forcer }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          from zoneinfo import ZoneInfo
          forcer = os.environ.get('FORCER') == 'true'
          autorise = datetime.now(ZoneInfo('Africa/Casablanca')).hour < 3 or forcer
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('autorise=' + str(autorise).lower() + '\n')
          if forcer:
              print('relevé forcé à la main')
          else:
              print('nuit autorisee' if autorise else 'trop tard : aucun releve')
          PY
      - name: run
        id: releve
        if: steps.heure.outputs.autorise == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: bash outils/marjane_nuit.sh

      # 30 octobre 2026 : GitHub a annulé ce job à 01 h 59, pendant l'étape run, sans
      # message de fin. Cette étape tourne après une annulation ou un échec. Sans
      # scraper/ (annulation avant le checkout), elle ne fait rien.
      - name: fil de suivi si interrompu
        if: cancelled() || (failure() && steps.releve.outcome != 'failure')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          [ -f scraper/signaler.py ] || exit 0
          timeout 30 python -m scraper.signaler --source "Marjane" --niveau alerte --message "relevé interrompu avant sa fin (job ${{ job.status }}) : aucun message de fin. Relancer à la main (taches, forcer) si la nuit est passée." || true

      # Le script mesure le pair actif avant de désactiver la sortie.
      # Un premier candidat arbitraire après déconnexion affichait un faux 0 Mo.

  # Alerte : une issue par job de relevé en échec ou annulé par GitHub.
  # 30 octobre 2026 : un job annulé (result « cancelled », pas « failure ») ne
  # déclenchait pas ce bilan ; garde_nuit.py --bilan le traite désormais comme un échec.
  # Le contrôle du matin (garde) ouvre les nuits sans aucun relevé réussi.
  bilan:
    needs: [run, marjane]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: issue pour chaque relevé en échec
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: python .github/garde_nuit.py --workflow taches.yml --jobs run marjane --bilan

name: taches

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  actions: write

concurrency:
  group: taches
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.DEPOT }}
          token: ${{ secrets.JETON }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt > /dev/null

      - name: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: bash outils/synchro_nuit.sh

      - name: garder
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/taches.yml/enable" > /dev/null

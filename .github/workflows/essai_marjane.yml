# Essai PARTIEL du relevé Marjane par le téléphone (Tailscale), en lecture
# seule : sortie au Maroc, jeton, 3 pages du catalogue omni, promos d'un
# magasin sans publier. Aucune écriture en base. Le relevé complet est le
# job `marjane` de taches.yml.
name: essai-marjane

on:
  push:
    paths: ['.github/workflows/essai_marjane.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: marjane
  cancel-in-progress: false

jobs:
  marjane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.DEPOT }}
          token: ${{ secrets.JETON }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt > /dev/null

      - name: tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: sortie par le telephone
        run: |
          # Par son adresse Tailscale : le nom d'appareil porte des espaces.
          sortie=$(tailscale status --json | jq -r '[.Peer[] | select(.ExitNodeOption) | .TailscaleIPs[0]][0] // empty')
          if [ -z "$sortie" ]; then
            echo "::error::téléphone absent : allumé, Tailscale connecté, « Run as exit node » actif ?"
            exit 1
          fi
          if ! err=$(sudo tailscale set --exit-node="$sortie" 2>&1); then
            echo "::error::tailscale set : ${err:0:200}"
            exit 1
          fi
          sleep 5

      - name: essai
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        shell: bash
        run: |
          # Lecture seule : aucune écriture en base, rien publié. Chaque
          # commande est notée ok ou ECHEC ; l'étape échoue à la fin si l'une
          # d'elles a échoué. Aucune sortie brute n'est affichée.
          echec=0

          # 1. Pays de sortie.
          if pays=$(python -c "from curl_cffi import requests; r = requests.get('https://www.cloudflare.com/cdn-cgi/trace', impersonate='chrome', timeout=30); r.raise_for_status(); print([l for l in r.text.splitlines() if l.startswith('loc=')][0][4:])" 2>/tmp/pays.err) && [ -n "$pays" ]; then
            echo "::notice::pays : $pays"
          else
            echo "::notice::pays : ECHEC $(tail -n 1 /tmp/pays.err | cut -c1-150)"
            echec=1
          fi

          # 2. Jeton (forcé).
          if python -m scraper.jeton --force > /tmp/jeton.txt 2>&1; then
            echo "::notice::jeton : ok $(grep -i -m 1 'validite' /tmp/jeton.txt | cut -c1-200)"
          else
            echo "::notice::jeton : ECHEC $(tail -n 1 /tmp/jeton.txt | cut -c1-150)"
            echec=1
          fi

          # 3. Catalogue omni, 3 pages.
          debut=$(date +%s)
          if python -m sondes.lister_omni_marjane --sortie /tmp/omni.jsonl --max-pages 3 > /tmp/omni.txt 2>&1; then
            duree=$(( $(date +%s) - debut ))
            lignes=$(cat /tmp/omni.jsonl 2>/dev/null | wc -l)
            echo "::notice::omni : $lignes lignes en $duree s"
          else
            echo "::notice::omni : ECHEC $(tail -n 1 /tmp/omni.txt | cut -c1-150)"
            echec=1
          fi

          # 4. Promos d'un magasin, sans --publier.
          debut=$(date +%s)
          if python -u -m scraper.promos_locales --enseigne Marjane --sources marjane-2 > /tmp/promos.txt 2>&1; then
            duree=$(( $(date +%s) - debut ))
            ligne=$(grep -m 1 'promos vérifiées' /tmp/promos.txt | cut -c1-200)
            echo "::notice::promos : ok en $duree s. ${ligne:-ligne « promos vérifiées » absente}"
          else
            echo "::notice::promos : ECHEC $(tail -n 1 /tmp/promos.txt | cut -c1-150)"
            echec=1
          fi

          if [ "$echec" -ne 0 ]; then
            echo "::error::essai partiel : au moins une commande a échoué (voir les notices)"
            exit 1
          fi

      - name: volume par le telephone
        if: always()
        run: |
          tailscale status --json | jq -r '[.Peer[] | select(.ExitNodeOption)][0] // empty
            | "::notice::par le téléphone : reçu \((.RxBytes // 0) / 1048576 | floor) Mo, envoyé \((.TxBytes // 0) / 1048576 | floor) Mo"' || true

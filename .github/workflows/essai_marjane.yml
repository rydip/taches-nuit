# Lancement d'essai ou manuel du relevé Marjane par le téléphone (Tailscale),
# hors de la synchro de nuit. Même contenu que le job `marjane` de taches.yml :
# si l'un change, changer l'autre.
name: essai-marjane

on:
  push:
    paths: ['.github/workflows/essai_marjane.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: marjane
  cancel-in-progress: false

jobs:
  marjane:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.DEPOT }}
          token: ${{ secrets.JETON }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt > /dev/null

      - name: tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: sortie par le telephone
        run: |
          # Par son adresse Tailscale : le nom d'appareil porte des espaces.
          sortie=$(tailscale status --json | jq -r '[.Peer[] | select(.ExitNodeOption) | .TailscaleIPs[0]][0] // empty')
          if [ -z "$sortie" ]; then
            echo "::error::téléphone absent : allumé, Tailscale connecté, « Run as exit node » actif ?"
            exit 1
          fi
          if ! err=$(sudo tailscale set --exit-node="$sortie" 2>&1); then
            echo "::error::tailscale set : ${err:0:200}"
            exit 1
          fi
          sleep 5

      - name: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: bash outils/marjane_nuit.sh

      - name: volume par le telephone
        if: always()
        run: |
          tailscale status --json | jq -r '[.Peer[] | select(.ExitNodeOption)][0] // empty
            | "::notice::par le téléphone : reçu \((.RxBytes // 0) / 1048576 | floor) Mo, envoyé \((.TxBytes // 0) / 1048576 | floor) Mo"' || true
